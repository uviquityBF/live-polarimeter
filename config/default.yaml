# Default configuration for livepol. Copy and edit, then pass with --config.

camera:
  ip: null                       # connect to this camera IP (null = first camera found)
  serial: null                   # or select by serial number
  pixel_format: PolarizeMono12   # or PolarizeMono16 (see `livepol-probe` for the names your camera offers)
  exposure_us: 5000
  gain_db: 0.0
  black_level: null              # null = leave the camera setting alone
  binning: 1
  roi: null                      # [x, y, width, height] sensor ROI, or null for full frame (x, y even)
  average_frames: 1
  # Raw full-scale value for the saturation check: "auto" derives it from the pixel format
  # name (12 -> 4095, 16 -> 65535); set a number if 12-bit data sits in a 16-bit container.
  full_scale: auto
  grab_timeout_ms: 2000

processing:
  # Polarizer angle (deg) of each pixel in a 2x2 block, rows top to bottom.
  # Recollection of the IMX250MZR layout; verify with the calibration utility.
  layout: [[90, 45], [135, 0]]
  aolp_offset_deg: 0.0           # angles are reported relative to this axis
  saturation_fraction: 0.98      # warn at or above this fraction of full scale
  roi:
    mode: auto                   # auto | rect | circle
    percentile: 99.5             # auto mode: S0 >= this percentile of the S0 image
    rect: [100, 100, 100, 100]   # x, y, width, height in Stokes-image (half-resolution) pixels
    circle: [600, 500, 50]       # cx, cy, radius in Stokes-image pixels
  dark_file: null                # .npy mosaic saved by "Capture dark"
  calibration_file: null         # JSON written by the calibration utility

simulate:
  shape: [2048, 2448]            # mosaic rows, cols
  dolp: 0.74
  aolp_deg: 174.3
  peak_s0: 1500.0                # S0 peak counts at the reference exposure
  reference_exposure_us: 5000
  sigma_px: 60.0
  noise: 2.0                     # counts rms per pixel
  drift_deg_per_s: 0.0
  wobble_deg: 0.2                # slow AoLP wobble amplitude
  fps: 20.0

replay:
  fps: 10.0

display:
  update_hz: 10
  history_s: 60

output:
  dir: data                      # snapshots, raw frames, dark frames, logs
  log_rate_hz: 5.0
